name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Triggers the pipeline on every push to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code into the runner
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Set up QEMU (Optional: useful for multi-platform builds like amd64/arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. Set up Docker Buildx (Enables advanced build capabilities)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Log in to Docker Hub using the secrets configured earlier
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build the image from your Dockerfile and push it to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Replace 'your-dockerhub-repo' with your actual Docker Hub repository namespace/name
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/your-dockerhub-repo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/your-dockerhub-repo:${{ github.sha }}
