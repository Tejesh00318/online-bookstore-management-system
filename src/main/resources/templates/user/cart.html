<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Cart - BookStore</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh}
  .card{border:none;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
  .container-narrow{max-width:960px}
  .navbar{background:linear-gradient(135deg,#667eea,#764ba2)!important}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background:linear-gradient(135deg,#667eea,#764ba2);">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/" th:href="@{/}"><i class="fas fa-book-open me-2"></i>BookStore</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/books" th:href="@{/books}">Books</a>
      <a class="nav-link" href="/user/cart" th:href="@{/user/cart}" sec:authorize="isAuthenticated()">Cart</a>
      <a class="nav-link" href="/login" th:href="@{/login}" sec:authorize="!isAuthenticated()">Login</a>
      <a class="nav-link" href="/user/dashboard" th:href="@{/user/dashboard}" sec:authorize="hasRole('USER')">Dashboard</a>
      <a class="nav-link" href="/admin/dashboard" th:href="@{/admin/dashboard}" sec:authorize="hasRole('ADMIN')">Admin</a>
      <form th:action="@{/logout}" method="post" class="ms-2" sec:authorize="isAuthenticated()">
        <button class="btn btn-outline-light btn-sm" type="submit"><i class="fas fa-sign-out-alt me-1"></i>Logout</button>
      </form>
    </div>
  </div>
</nav>
<div class="container mt-3">
  <a href="javascript:history.back()" class="text-white text-decoration-none d-inline-flex align-items-center">
    <i class="fas fa-arrow-left me-2"></i><span style="font-size:1.1rem">Back</span>
  </a>
</div>
<div class="container-fluid px-3">

<div class="container py-4">
  <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
    <i class="fas fa-check-circle me-2"></i><span th:text="${message}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
    <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <h1 class="text-white mb-4"><i class="fas fa-shopping-cart me-2"></i>My Shopping Cart</h1>

  <div th:if="${cartItems != null and !cartItems.empty}">
    <div class="card">
      <div class="card-body">
        <div th:each="item : ${cartItems}" class="row align-items-center border-bottom py-3">
          <div class="col-md-2">
            <img th:src="${item.book.imageUrl}" class="img-fluid rounded" style="height:100px;object-fit:cover" data-cover-fallback>
          </div>
          <div class="col-md-4">
            <h6 th:text="${item.book.title}">Book Title</h6>
            <small class="text-muted" th:text="${'by ' + item.book.author}">Author</small>
          </div>
          <div class="col-md-2">
            <span class="fw-bold" th:text="${'₹' + item.book.price}">₹0.00</span>
          </div>
          <div class="col-md-2">
            <form th:action="@{/user/cart/update}" method="post" class="d-flex align-items-center">
              <input type="hidden" name="cartItemId" th:value="${item.id}">
              <input type="number" name="quantity" th:value="${item.quantity}" min="1" th:max="${item.book.stockQuantity}" class="form-control me-2" style="width:80px">
              <button type="submit" class="btn btn-sm btn-outline-primary"><i class="fas fa-sync"></i></button>
            </form>
          </div>
          <div class="col-md-1">
            <span class="fw-bold text-success" th:text="${'₹' + (item.book.price * item.quantity)}">₹0.00</span>
          </div>
          <div class="col-md-1">
            <form th:action="@{/user/cart/remove}" method="post">
              <input type="hidden" name="cartItemId" th:value="${item.id}">
              <button type="submit" class="btn btn-sm btn-outline-danger"><i class="fas fa-trash"></i></button>
            </form>
          </div>
        </div>

        <div class="row mt-4">
          <div class="col-md-8">
            <form th:action="@{/user/cart/clear}" method="post">
              <button type="submit" class="btn btn-outline-danger" onclick="return confirm('Clear entire cart?')">
                <i class="fas fa-trash me-2"></i>Clear Cart
              </button>
            </form>
          </div>
          <div class="col-md-4">
            <div class="card bg-light">
              <div class="card-body text-center">
                <h5>Cart Total</h5>
                <h2 class="text-success" th:text="${cartTotal != null ? '₹' + cartTotal : '₹0.00'}">₹0.00</h2>
                <a class="btn btn-success btn-lg w-100" th:href="@{/user/checkout}">
                  <i class="fas fa-credit-card me-2"></i>Proceed to Checkout
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div th:if="${cartItems == null or cartItems.empty}">
    <div class="card text-center">
      <div class="card-body py-5">
        <i class="fas fa-shopping-cart fa-4x text-muted mb-4"></i>
        <h4 class="text-muted">Your cart is empty</h4>
        <p class="text-muted">Add some books to get started!</p>
        <a class="btn btn-primary btn-lg" th:href="@{/books}">
          <i class="fas fa-book me-2"></i>Browse Books
        </a>
      </div>
    </div>
  </div>
</div>
</div>
<script>
const COVERS=[
 'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800',
 'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=800',
 'https://images.unsplash.com/photo-1516979187457-637abb4f9353?w=800',
 'https://images.unsplash.com/photo-1521587760476-6c12a4b040da?w=800',
 'https://images.unsplash.com/photo-1544937950-fa07a98d237f?w=800',
 'https://images.unsplash.com/photo-1512820790803-83ca734da794?w=800',
 'https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=800',
 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800',
 'https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=800'
];
function rnd(){return COVERS[Math.floor(Math.random()*COVERS.length)]}
window.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('img[data-cover-fallback]').forEach(img=>{
    if(!img.getAttribute('src')||img.getAttribute('src')===''){img.setAttribute('src',rnd());}
    img.onerror=()=>img.setAttribute('src',rnd());
  });
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
