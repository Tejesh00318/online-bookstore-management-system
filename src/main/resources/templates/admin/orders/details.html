<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Order Details - Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh}
  .card{border:none;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
  .container-narrow{max-width:960px}
  .navbar{background:linear-gradient(135deg,#667eea,#764ba2)!important}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background:linear-gradient(135deg,#667eea,#764ba2);">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/" th:href="@{/}"><i class="fas fa-book-open me-2"></i>BookStore</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/books" th:href="@{/books}">Books</a>
      <a class="nav-link" href="/user/cart" th:href="@{/user/cart}" sec:authorize="isAuthenticated()">Cart</a>
      <a class="nav-link" href="/login" th:href="@{/login}" sec:authorize="!isAuthenticated()">Login</a>
      <a class="nav-link" href="/user/dashboard" th:href="@{/user/dashboard}" sec:authorize="hasRole('USER')">Dashboard</a>
      <a class="nav-link" href="/admin/dashboard" th:href="@{/admin/dashboard}" sec:authorize="hasRole('ADMIN')">Admin</a>
      <form th:action="@{/logout}" method="post" class="ms-2" sec:authorize="isAuthenticated()">
        <button class="btn btn-outline-light btn-sm" type="submit"><i class="fas fa-sign-out-alt me-1"></i>Logout</button>
      </form>
    </div>
  </div>
</nav>
<div class="container mt-3">
  <a href="javascript:history.back()" class="text-white text-decoration-none d-inline-flex align-items-center">
    <i class="fas fa-arrow-left me-2"></i><span style="font-size:1.1rem">Back</span>
  </a>
</div>
<div class="container-fluid px-3">

<div class="container py-4" th:if="${order != null}">
  <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

  <h1 class="text-white mb-4" th:text="'Order Details - ' + ${order.orderNumber}">Order Details</h1>

  <div class="row g-4">
    <div class="col-md-8">
      <div class="card mb-4">
        <div class="card-header"><h5>Order Information</h5></div>
        <div class="card-body">
          <div class="row">
            <div class="col-md-6">
              <p><strong>Order Number:</strong> <span th:text="${order.orderNumber}">ORD001</span></p>
              <p><strong>Customer:</strong> <span th:text="${order.user.fullName}">Customer</span></p>
              <p><strong>Email:</strong> <span th:text="${order.user.email}">email</span></p>
              <p><strong>Date:</strong> <span th:text="${#temporals.format(order.createdAt,'MMM dd, yyyy HH:mm')}">Date</span></p>
            </div>
            <div class="col-md-6">
              <p><strong>Status:</strong> <span class="badge bg-info fs-6" th:text="${order.status}">Status</span></p>
              <p><strong>Payment:</strong> <span th:text="${order.paymentMethod}">COD</span></p>
              <p><strong>Total:</strong> <span class="h4 text-success" th:text="${'₹' + order.totalAmount}">₹0.00</span></p>
            </div>
          </div>
          <div><strong>Address:</strong> <span th:text="${order.shippingAddress}">Address</span></div>
          <div th:if="${order.specialInstructions}"><strong>Instructions:</strong> <span th:text="${order.specialInstructions}">Instructions</span></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><h5>Order Items</h5></div>
        <div class="card-body">
          <div th:each="item : ${orderItems}" class="row align-items-center border-bottom py-3">
            <div class="col-md-2">
              <img th:src="${item.book.imageUrl}" style="width:50px;height:70px;object-fit:cover;border-radius:5px" data-cover-fallback>
            </div>
            <div class="col-md-5">
              <h6 th:text="${item.book.title}">Book</h6>
              <small class="text-muted" th:text="${'by ' + item.book.author}">Author</small>
            </div>
            <div class="col-md-2 text-center">
              <span class="badge bg-secondary" th:text="${item.quantity}">Qty</span>
            </div>
            <div class="col-md-2">
              <span th:text="${'₹' + item.price}">₹0.00</span>
            </div>
            <div class="col-md-1">
              <span class="fw-bold text-success" th:text="${'₹' + (item.price * item.quantity)}">₹0.00</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card">
        <div class="card-header"><h5>Actions</h5></div>
        <div class="card-body">
          <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" class="mb-3">
            <label class="form-label">Update Status:</label>
            <select name="status" class="form-select mb-2">
              <option th:each="s : ${orderStatuses}" th:value="${s}" th:text="${s}" th:selected="${s == order.status}">Status</option>
            </select>
            <button type="submit" class="btn btn-primary w-100">Update Status</button>
          </form>

          <form th:action="@{/admin/orders/{id}/cancel(id=${order.id})}" method="post" th:if="${order.status.name() != 'CANCELLED'}" onsubmit="return confirm('Cancel this order?')">
            <button type="submit" class="btn btn-danger w-100">Cancel Order</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
<script>
const COVERS=[
 'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800',
 'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=800',
 'https://images.unsplash.com/photo-1516979187457-637abb4f9353?w=800',
 'https://images.unsplash.com/photo-1521587760476-6c12a4b040da?w=800',
 'https://images.unsplash.com/photo-1544937950-fa07a98d237f?w=800',
 'https://images.unsplash.com/photo-1512820790803-83ca734da794?w=800',
 'https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=800',
 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800',
 'https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=800'
];
function rnd(){return COVERS[Math.floor(Math.random()*COVERS.length)]}
window.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('img[data-cover-fallback]').forEach(img=>{
    if(!img.getAttribute('src')||img.getAttribute('src')===''){img.setAttribute('src',rnd());}
    img.onerror=()=>img.setAttribute('src',rnd());
  });
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
