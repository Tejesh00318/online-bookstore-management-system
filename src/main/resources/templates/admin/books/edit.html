<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Edit Book - Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh}
  .card{border:none;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
  .container-narrow{max-width:960px}
  .navbar{background:linear-gradient(135deg,#667eea,#764ba2)!important}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background:linear-gradient(135deg,#667eea,#764ba2);">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/" th:href="@{/}"><i class="fas fa-book-open me-2"></i>BookStore</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/books" th:href="@{/books}">Books</a>
      <a class="nav-link" href="/user/cart" th:href="@{/user/cart}" sec:authorize="isAuthenticated()">Cart</a>
      <a class="nav-link" href="/login" th:href="@{/login}" sec:authorize="!isAuthenticated()">Login</a>
      <a class="nav-link" href="/user/dashboard" th:href="@{/user/dashboard}" sec:authorize="hasRole('USER')">Dashboard</a>
      <a class="nav-link" href="/admin/dashboard" th:href="@{/admin/dashboard}" sec:authorize="hasRole('ADMIN')">Admin</a>
      <form th:action="@{/logout}" method="post" class="ms-2" sec:authorize="isAuthenticated()">
        <button class="btn btn-outline-light btn-sm" type="submit"><i class="fas fa-sign-out-alt me-1"></i>Logout</button>
      </form>
    </div>
  </div>
</nav>
<div class="container mt-3">
  <a href="javascript:history.back()" class="text-white text-decoration-none d-inline-flex align-items-center">
    <i class="fas fa-arrow-left me-2"></i><span style="font-size:1.1rem">Back</span>
  </a>
</div>
<div class="container-fluid px-3">

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-xl-8">
      <div class="card">
        <div class="card-header">
          <h3 class="mb-0"><i class="fas fa-edit me-2"></i>Edit Book</h3>
        </div>
        <div class="card-body">
          <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

          <form th:action="@{/admin/books/{id}/edit(id=${book.id})}" method="post" th:object="${book}">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">ISBN *</label>
                <input class="form-control" th:field="*{isbn}" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Title *</label>
                <input class="form-control" th:field="*{title}" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Author *</label>
                <input class="form-control" th:field="*{author}" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Category *</label>
                <select class="form-select" th:field="*{category}" required>
                  <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}">Category</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label">Description</label>
                <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
              </div>
              <div class="col-md-4">
                <label class="form-label">Price (₹) *</label>
                <input class="form-control" type="number" step="0.01" th:field="*{price}" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Stock Quantity *</label>
                <input class="form-control" type="number" th:field="*{stockQuantity}" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Publication Year</label>
                <input class="form-control" type="number" th:field="*{publicationYear}">
              </div>
              <div class="col-md-6">
                <label class="form-label">Publisher</label>
                <input class="form-control" th:field="*{publisher}">
              </div>
              <div class="col-md-6">
                <label class="form-label">Pages</label>
                <input class="form-control" type="number" th:field="*{pages}">
              </div>
              <div class="col-md-6">
                <label class="form-label">Language</label>
                <input class="form-control" th:field="*{language}">
              </div>
              <div class="col-md-6">
                <label class="form-label">Image URL</label>
                <input class="form-control" type="url" th:field="*{imageUrl}">
              </div>
            </div>

            <div class="d-flex justify-content-between mt-4">
              <a th:href="@{/admin/books}" class="btn btn-secondary btn-lg">
                <i class="fas fa-arrow-left me-2"></i>Back to Books
              </a>
              <button type="submit" class="btn btn-success btn-lg">
                <i class="fas fa-save me-2"></i>Update Book
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
<script>
const COVERS=[
 'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800',
 'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=800',
 'https://images.unsplash.com/photo-1516979187457-637abb4f9353?w=800',
 'https://images.unsplash.com/photo-1521587760476-6c12a4b040da?w=800',
 'https://images.unsplash.com/photo-1544937950-fa07a98d237f?w=800',
 'https://images.unsplash.com/photo-1512820790803-83ca734da794?w=800',
 'https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=800',
 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800',
 'https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=800'
];
function rnd(){return COVERS[Math.floor(Math.random()*COVERS.length)]}
window.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('img[data-cover-fallback]').forEach(img=>{
    if(!img.getAttribute('src')||img.getAttribute('src')===''){img.setAttribute('src',rnd());}
    img.onerror=()=>img.setAttribute('src',rnd());
  });
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
