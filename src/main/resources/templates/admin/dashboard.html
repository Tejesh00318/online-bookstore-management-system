<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Dashboard - BookStore</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh}
  .card{border:none;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
  .container-narrow{max-width:960px}
  .navbar{background:linear-gradient(135deg,#667eea,#764ba2)!important}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background:linear-gradient(135deg,#667eea,#764ba2);">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/" th:href="@{/}"><i class="fas fa-book-open me-2"></i>BookStore</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/books" th:href="@{/books}">Books</a>
      <a class="nav-link" href="/user/cart" th:href="@{/user/cart}" sec:authorize="isAuthenticated()">Cart</a>
      <a class="nav-link" href="/login" th:href="@{/login}" sec:authorize="!isAuthenticated()">Login</a>
      <a class="nav-link" href="/user/dashboard" th:href="@{/user/dashboard}" sec:authorize="hasRole('USER')">Dashboard</a>
      <a class="nav-link" href="/admin/dashboard" th:href="@{/admin/dashboard}" sec:authorize="hasRole('ADMIN')">Admin</a>
      <form th:action="@{/logout}" method="post" class="ms-2" sec:authorize="isAuthenticated()">
        <button class="btn btn-outline-light btn-sm" type="submit"><i class="fas fa-sign-out-alt me-1"></i>Logout</button>
      </form>
    </div>
  </div>
</nav>
<div class="container mt-3">
  <a href="javascript:history.back()" class="text-white text-decoration-none d-inline-flex align-items-center">
    <i class="fas fa-arrow-left me-2"></i><span style="font-size:1.1rem">Back</span>
  </a>
</div>
<div class="container-fluid px-3">

<div class="container-fluid py-4">
  <h1 class="text-white mb-4"><i class="fas fa-gauge-high me-2"></i>Admin Dashboard</h1>

  <div class="row g-4 mb-5">
    <div class="col-lg-3 col-md-6">
      <div class="card text-center h-100">
        <div class="card-body">
          <i class="fas fa-book fa-3x text-primary mb-3"></i>
          <h5>Total Books</h5>
          <h2 class="text-primary" th:text="${totalBooks} ?: 0">0</h2>
          <small class="text-success" th:text="${inStockBooks} ?: 0">0</small> <small class="text-muted">in stock</small>
        </div>
      </div>
    </div>
    <div class="col-lg-3 col-md-6">
      <div class="card text-center h-100">
        <div class="card-body">
          <i class="fas fa-shopping-bag fa-3x text-info mb-3"></i>
          <h5>Orders</h5>
          <h2 class="text-info" th:text="${totalOrders} ?: 0">0</h2>
          <small class="text-warning" th:text="${pendingOrders} ?: 0">0</small> <small class="text-muted">pending</small>
        </div>
      </div>
    </div>
    <div class="col-lg-3 col-md-6">
      <div class="card text-center h-100">
        <div class="card-body">
          <i class="fas fa-users fa-3x text-warning mb-3"></i>
          <h5>Customers</h5>
          <h2 class="text-warning" th:text="${totalUsers} ?: 0">0</h2>
          <small class="text-muted">registered</small>
        </div>
      </div>
    </div>
    <div class="col-lg-3 col-md-6">
      <div class="card text-center h-100">
        <div class="card-body">
          <i class="fas fa-rupee-sign fa-3x text-success mb-3"></i>
          <h5>Revenue</h5>
          <h2 class="text-success" th:text="${totalRevenue != null ? '₹' + totalRevenue : '₹0.00'}">₹0.00</h2>
          <small class="text-success" th:text="${monthRevenue != null ? 'This month: ₹' + monthRevenue : 'This month: ₹0.00'}">This month: ₹0.00</small>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-3 col-md-6">
      <a class="btn btn-success btn-lg w-100 h-100 d-flex flex-column justify-content-center" th:href="@{/admin/books/add}">
        <i class="fas fa-plus fa-2x mb-2"></i>Add New Book
      </a>
    </div>
    <div class="col-lg-3 col-md-6">
      <a class="btn btn-primary btn-lg w-100 h-100 d-flex flex-column justify-content-center" th:href="@{/admin/books}">
        <i class="fas fa-book fa-2x mb-2"></i>Manage Books
      </a>
    </div>
    <div class="col-lg-3 col-md-6">
      <a class="btn btn-warning btn-lg w-100 h-100 d-flex flex-column justify-content-center" th:href="@{/admin/orders}">
        <i class="fas fa-shopping-bag fa-2x mb-2"></i>Manage Orders
      </a>
    </div>
    <div class="col-lg-3 col-md-6">
      <a class="btn btn-info btn-lg w-100 h-100 d-flex flex-column justify-content-center" th:href="@{/admin/users}">
        <i class="fas fa-users fa-2x mb-2"></i>Manage Users
      </a>
    </div>
  </div>
</div>
</div>
<script>
const COVERS=[
 'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800',
 'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=800',
 'https://images.unsplash.com/photo-1516979187457-637abb4f9353?w=800',
 'https://images.unsplash.com/photo-1521587760476-6c12a4b040da?w=800',
 'https://images.unsplash.com/photo-1544937950-fa07a98d237f?w=800',
 'https://images.unsplash.com/photo-1512820790803-83ca734da794?w=800',
 'https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=800',
 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800',
 'https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=800'
];
function rnd(){return COVERS[Math.floor(Math.random()*COVERS.length)]}
window.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('img[data-cover-fallback]').forEach(img=>{
    if(!img.getAttribute('src')||img.getAttribute('src')===''){img.setAttribute('src',rnd());}
    img.onerror=()=>img.setAttribute('src',rnd());
  });
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
