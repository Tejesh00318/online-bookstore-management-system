<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login - BookStore</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh}
  .card{border:none;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
  .container-narrow{max-width:960px}
  .navbar{background:linear-gradient(135deg,#667eea,#764ba2)!important}
</style>
</head>
<body class="d-flex align-items-center justify-content-center">

<div class="card shadow-lg" style="max-width:420px;width:100%">
  <div class="card-header text-white text-center py-4" style="background:linear-gradient(135deg,#667eea,#764ba2);">
    <h4 class="mb-0"><i class="fas fa-book-open me-2"></i>BookStore</h4>
    <small>Welcome back!</small>
  </div>
  <div class="card-body p-4">
    <div th:if="${error}" class="alert alert-danger">
      <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}">Invalid credentials</span>
    </div>
    <div th:if="${message}" class="alert alert-success">
      <i class="fas fa-check-circle me-2"></i><span th:text="${message}">Logged out</span>
    </div>

    <form th:action="@{/login}" method="post">
      <div class="mb-3">
        <label class="form-label"><i class="fas fa-user me-2"></i>Username</label>
        <input class="form-control form-control-lg" type="text" name="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label"><i class="fas fa-lock me-2"></i>Password</label>
        <input class="form-control form-control-lg" type="password" name="password" required>
      </div>
      <div class="d-grid mb-3">
        <button class="btn btn-primary btn-lg" type="submit">
          <i class="fas fa-sign-in-alt me-2"></i>Login
        </button>
      </div>
    </form>

    <hr>
    <div class="text-center">
      <p class="mb-2">Don't have an account?</p>
      <a th:href="@{/register}" class="btn btn-outline-primary">
        <i class="fas fa-user-plus me-2"></i>Create Account
      </a>
    </div>

    <div class="text-center mt-4">
      <small class="text-muted">Demo: admin/admin123 | user/user123</small>
    </div>
  </div>
</div>
<script>
const COVERS=[
 'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800',
 'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=800',
 'https://images.unsplash.com/photo-1516979187457-637abb4f9353?w=800',
 'https://images.unsplash.com/photo-1521587760476-6c12a4b040da?w=800',
 'https://images.unsplash.com/photo-1544937950-fa07a98d237f?w=800',
 'https://images.unsplash.com/photo-1512820790803-83ca734da794?w=800',
 'https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=800',
 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800',
 'https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=800'
];
function rnd(){return COVERS[Math.floor(Math.random()*COVERS.length)]}
window.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('img[data-cover-fallback]').forEach(img=>{
    if(!img.getAttribute('src')||img.getAttribute('src')===''){img.setAttribute('src',rnd());}
    img.onerror=()=>img.setAttribute('src',rnd());
  });
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
