<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Register - BookStore</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh}
  .card{border:none;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
  .container-narrow{max-width:960px}
  .navbar{background:linear-gradient(135deg,#667eea,#764ba2)!important}
</style>
</head>
<body class="d-flex align-items-center justify-content-center">

<div class="card shadow-lg" style="max-width:600px;width:100%">
  <div class="card-header text-white text-center py-3" style="background:linear-gradient(135deg,#667eea,#764ba2);">
    <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i>Create Account</h4>
  </div>
  <div class="card-body p-4">
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form th:action="@{/register}" th:object="${user}" method="post" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">First Name</label>
        <input class="form-control" th:field="*{firstName}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Last Name</label>
        <input class="form-control" th:field="*{lastName}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Username</label>
        <input class="form-control" th:field="*{username}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" th:field="*{email}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" th:field="*{password}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Confirm Password</label>
        <input class="form-control" type="password" name="confirmPassword" required>
      </div>
      <div class="col-12">
        <label class="form-label">Address</label>
        <textarea class="form-control" th:field="*{address}" rows="2"></textarea>
      </div>
      <div class="col-md-6">
        <label class="form-label">Phone</label>
        <input class="form-control" th:field="*{phone}">
      </div>
      <div class="col-12 d-flex justify-content-between">
        <a class="btn btn-secondary" th:href="@{/login}">
          <i class="fas fa-arrow-left me-2"></i>Back to Login
        </a>
        <button class="btn btn-success" type="submit">
          <i class="fas fa-user-plus me-2"></i>Register
        </button>
      </div>
    </form>
  </div>
</div>
<script>
const COVERS=[
 'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800',
 'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=800',
 'https://images.unsplash.com/photo-1516979187457-637abb4f9353?w=800',
 'https://images.unsplash.com/photo-1521587760476-6c12a4b040da?w=800',
 'https://images.unsplash.com/photo-1544937950-fa07a98d237f?w=800',
 'https://images.unsplash.com/photo-1512820790803-83ca734da794?w=800',
 'https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=800',
 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800',
 'https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=800'
];
function rnd(){return COVERS[Math.floor(Math.random()*COVERS.length)]}
window.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('img[data-cover-fallback]').forEach(img=>{
    if(!img.getAttribute('src')||img.getAttribute('src')===''){img.setAttribute('src',rnd());}
    img.onerror=()=>img.setAttribute('src',rnd());
  });
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
